# Supply-chain cooldown: skip releases younger than 7 days (minutes).
minimumReleaseAge: 10080

allowBuilds:
  # Native Rust binary linked by its postinstall; this is the JS security
  # scanner audit:js runs (see dev-environment/ast-grep/sgconfig.yml).
  '@ast-grep/cli': true
  esbuild: true
  lefthook: true

# nanoid<3.3.18 (transitive via vitest>vite>postcss) has a known DoS advisory
# (GHSA-2v37-7h3g-55p8); postcss's own ^3.3.x range allows the fix but pnpm
# won't move a deduped transitive version without an override.
overrides:
  nanoid: "^3.3.18"
