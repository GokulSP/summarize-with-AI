version: "3"

tasks:
  setup:
    desc: Install dependencies and git hooks
    cmds:
      - pnpm install
      - lefthook install

  lint:
    deps: [lint:js, lint:md]
  lint:js:
    cmds:
      - pnpm exec biome check --write {{.CLI_ARGS}}
  lint:md:
    cmds:
      - uvx rumdl check --fix {{.CLI_ARGS}}

  typecheck:
    deps: [typecheck:js]
  typecheck:js:
    cmds:
      - pnpm exec tsc -p jsconfig.json --noEmit

  test:
    deps: [test:js]
  test:js:
    cmds:
      - >-
        pnpm exec vitest run --coverage --coverage.include="*.user.js"
        --coverage.reporter=text --coverage.thresholds.lines=80
        --coverage.thresholds.branches=76

  audit:
    deps: [audit:js]
  audit:js:
    cmds:
      - pnpm audit
      - >
        docker run --rm -v "{{.TASKFILE_DIR}}:/src"
        -e SEMGREP_ENABLE_VERSION_CHECK=0 semgrep/semgrep
        semgrep scan --config p/javascript --config p/nodejsscan
        --metrics off --error /src

  check:lockfile:
    deps: [check:lockfile-js]
  check:lockfile-js:
    cmds:
      - pnpm install --frozen-lockfile

  security:secrets:
    cmds:
      - gitleaks git --pre-commit --staged -v
  security:history:
    cmds:
      - gitleaks git -v
  check:commit-msg:
    cmds:
      - uvx gitfluff lint {{.CLI_ARGS}} --write

  sync:metadata:
    cmds:
      - node scripts/sync-metadata.js

  update:
    desc: Monthly. Upgrade locked deps, uvx cache and system binaries, then re-run checks
    cmds:
      - pnpm update --latest
      - pnpm exec knip
      - uv cache clean rumdl gitfluff semgrep
      - uv self update
      - cmd: winget upgrade --all
        ignore_error: true
      - task: lint
      - task: typecheck
      - task: test
      - task: audit

  ci:
    desc: Every gate on every file and the whole history. Run after cloning and before a release
    cmds:
      - task: check:lockfile
      - task: setup
      - task: lint
      - task: typecheck
      - task: test
      - task: audit
      - task: security:history
