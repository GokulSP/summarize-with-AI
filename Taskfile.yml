version: "3"

tasks:
  setup:
    desc: Install dependencies and git hooks
    cmds:
      - pnpm install
      - lefthook install

  lint:
    deps: [lint:js, lint:md]
  lint:js:
    cmds:
      - pnpm exec biome check --write {{.CLI_ARGS}}
  lint:md:
    cmds:
      - uvx rumdl check --fix {{.CLI_ARGS}}

  typecheck:
    deps: [typecheck:js]
  typecheck:js:
    cmds:
      # Bare `tsc --checkJs --noEmit` only auto-discovers tsconfig.json, never
      # jsconfig.json, so -p points it there explicitly.
      - pnpm exec tsc -p jsconfig.json --noEmit

  test:
    deps: [test:js]
  test:js:
    cmds:
      - pnpm exec vitest run

  security:secrets:
    cmds:
      - gitleaks protect --staged -v

  audit:js:
    cmds:
      - pnpm audit

  check:lockfile-js:
    cmds:
      - pnpm install --frozen-lockfile

  check:commit-msg:
    cmds:
      - uvx gitfluff lint {{.CLI_ARGS}} --write

  sync:metadata:
    cmds:
      - node scripts/sync-metadata.js

  update:
    desc: Monthly. Upgrade locked deps, uvx cache and system binaries, then re-run checks
    cmds:
      - pnpm update --latest
      - uv cache clean rumdl gitfluff
      - uv self update
      - winget upgrade --all
      - task: lint
      - task: typecheck
      - task: test
      - task: audit:js
