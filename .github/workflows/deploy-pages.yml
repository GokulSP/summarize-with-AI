name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          # v6.3.0+ reads devEngines.runtime, so package.json is the one Node pin
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Typecheck and test go through Taskfile.yml, so the coverage floors are set in one place
      - name: Setup Task
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Not `task lint`: that one rewrites files (--write) and needs uv for rumdl
      - name: Lint
        run: pnpm exec biome check

      - name: Typecheck
        run: task typecheck:js

      - name: Test
        run: task test:js

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Publish tracked files only, so node_modules never reaches Pages
      - name: Stage site
        run: mkdir _site && git ls-files -z | xargs -0 cp --parents -t _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
