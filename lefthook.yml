pre-commit:
  commands:
    lint-js:
      glob: "*.{js,json}"
      run: task lint:js -- {staged_files}
      stage_fixed: true
    lint-md:
      glob: "*.md"
      run: task lint:md -- {staged_files}
      stage_fixed: true
    metadata:
      glob: "Summarize with AI.user.js"
      run: task sync:metadata
    secrets:
      run: task security:secrets

commit-msg:
  commands:
    conventional:
      run: task check:commit-msg -- {1}

pre-push:
  commands:
    check-lockfile-js:
      run: task check:lockfile-js
    audit-js:
      run: task audit:js
